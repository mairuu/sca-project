---
# roles/terraform/tasks/main.yml
# Installs Terraform binary on the builder node

- name: Set Terraform version
  set_fact:
    terraform_version: "1.9.0"

- name: Check if terraform already installed with correct version
  command: terraform --version
  register: tf_check
  changed_when: false
  failed_when: false

- name: Download Terraform zip
  get_url:
    url: "https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_amd64.zip"
    dest: "/tmp/terraform_{{ terraform_version }}.zip"
    mode: '0644'
  when: tf_check.rc != 0 or terraform_version not in tf_check.stdout

- name: Unzip Terraform binary
  unarchive:
    src: "/tmp/terraform_{{ terraform_version }}.zip"
    dest: /usr/local/bin/
    remote_src: yes
    mode: '0755'
  when: tf_check.rc != 0 or terraform_version not in tf_check.stdout

- name: Clean up downloaded zip
  file:
    path: "/tmp/terraform_{{ terraform_version }}.zip"
    state: absent
  when: tf_check.rc != 0 or terraform_version not in tf_check.stdout

- name: Verify Terraform installation
  command: terraform --version
  register: tf_version_out
  changed_when: false

- name: Print Terraform version
  debug:
    msg: "Terraform installed: {{ tf_version_out.stdout_lines[0] }}"
